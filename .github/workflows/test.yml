name: Test

# Static analysis and tests; gates every build and deploy.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: mypy
        run: uv run mypy --junit-xml reports/mypy.xml .
      - name: pytest (unit + contract, no AWS, no Docker)
        run: uv run pytest -q -m "not aws and not docker" --junitxml=reports/pytest.xml
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-backend
          path: backend/reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: prettier
        run: npm run format
      - name: eslint
        run: npm run lint
      - name: vitest
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-frontend
          path: frontend/reports/
          if-no-files-found: ignore
          retention-days: 14
