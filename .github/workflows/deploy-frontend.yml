name: Deploy frontend

# Uploads the built SPA to the environment's private bucket and invalidates CloudFront.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (dev, staging or production).
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_REGION:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  spa:
    name: SPA (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-frontend-${{ inputs.environment }}
      cancel-in-progress: false
    permissions: {} # same-run artifact download needs no token scope
    env:
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Check environment variables
        run: |
          : "${BUCKET:?set FRONTEND_BUCKET on this environment}"
          : "${DISTRIBUTION_ID:?set CLOUDFRONT_DISTRIBUTION_ID on this environment}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist
      # Access keys because this account cannot create IAM roles. Upgrade path: OIDC —
      # `role-to-assume` here plus `id-token: write` above, then delete the key secrets.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }} # not secret; a variable keeps ARNs unmasked
      # Hashed assets first and cached forever, so the new index.html never points at a missing file.
      - name: Upload to S3
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete --no-progress \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --no-progress --exclude "assets/*" \
            --cache-control "no-cache"
      # "/*" is one billable path; hashed assets are new keys, so it only matters for index.html.
      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
          echo "Invalidation $id completed"
