name: Set up backend
description: Pinned uv with its cache; Python 3.13 comes from backend/.python-version.
inputs:
  sync:
    description: Also install the locked workspace environment (dev tools included).
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.11.7"
        working-directory: backend
        enable-cache: true
        cache-dependency-glob: uv.lock
    - if: inputs.sync == 'true'
      shell: bash
      working-directory: backend
      run: uv sync --locked
