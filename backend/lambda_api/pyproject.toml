[project]
name = "planner-api"
version = "0.1.0"
description = "REST API Lambda: handler, wiring and adapters for regular backend operations. Depends on planner-core only until its AWS adapters are built (P1)."
requires-python = ">=3.13, <3.14"
dependencies = [
    "planner-core",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"

[tool.uv.sources]
planner-core = { workspace = true }
