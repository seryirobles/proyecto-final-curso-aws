[project]
name = "planner-api"
version = "0.1.0"
description = "REST API Lambda: handler, wiring and adapters for regular backend operations."
requires-python = ">=3.13, <3.14"
dependencies = [
    "planner-core",
    # The api adapter closure: DynamoDB + SQS (docs/architecture.md section 1.3,
    # specs/rest_api_persistence_and_services/design.md section 2). Never an AI SDK.
    "boto3>=1.35",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"

[tool.uv.sources]
planner-core = { workspace = true }
