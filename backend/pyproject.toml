# Virtual workspace root: no [project] table, since the root itself ships
# nothing. Shared ruff/mypy/pytest config lives here so every member inherits
# it (docs/architecture.md section 1.3, 3).
[tool.uv.workspace]
members = ["core", "lambda_api", "lambda_ai"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    # Test-only: Windows ships no IANA tz database, so zoneinfo needs this to
    # resolve Europe/Madrid. Dev group only — planner-core keeps zero runtime
    # dependencies (specs/week_calendar/design.md section 7).
    "tzdata>=2025.2",
    # Test-only: moto backs the DynamoDB adapter contract suites in the default
    # gate; workspace-root dev dep so `uv run pytest` resolves it, like tzdata
    # (specs/rest_api_persistence_and_services/design.md section 9).
    "moto[dynamodb]>=5.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.13"

# boto3/moto ship no type information; the adapter code converts every value it
# reads out of the SDK explicitly, so Any does not propagate past the boundary.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "aws: marks tests that hit real AWS services; deselected by default (see docs/verification.md)",
    "docker: marks tests that hit DynamoDB Local via Docker; deselected by default (see docs/verification.md)",
]
addopts = "-m \"not aws and not docker\""
# Lets lambda_api's tests `from support.fakes import ...` without a second
# conftest.py named "conftest" (mypy treats same-named rootless test dirs as
# a module clash; core/tests/conftest.py already does this insertion for
# core's own tests, and this reuses the same target, feature 16 design.md).
pythonpath = ["core/tests"]
